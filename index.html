<script>
/* Teema määratakse enne esimest joonistust, et vältida vale värviteema välkumist */
(function(){
  try{
    var raw = localStorage.getItem('qba-state-v1');
    var s = raw ? JSON.parse(raw) : null;
    var t = s && s.ui && s.ui.theme;
    if (t !== 'light' && t !== 'dark') t = (matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  }catch(e){ document.documentElement.dataset.theme = 'light'; }
})();
</script>

<style>
/* ===== Disainisüsteem: "Läänemere pearaamat" v2.0 — hele/tume teema ===== */
:root{
  /* HELE REŽIIM (vaikimisi) */
  --paper:#f8fafc; --card:#ffffff; --line:#e2e8f0; --line-soft:#f1f5f9; --chip:#f1f5f9;
  --ink:#0f172a; --muted:#475569;
  --accent:#059669; --accent-ink:#ffffff;
  --save:#059669; --save-bg:#ecfdf5;
  --warn:#d97706; --warn-bg:#fffbeb;
  --bad:#dc2626; --bad-bg:#fef2f2;
  --btn-bg:#0f172a; --btn-fg:#ffffff;
  --hero-bg:#0f172a; --hero-fg:#ffffff; --hero-muted:#94a3b8;
  --panel-shadow:0 1px 2px rgba(15,23,42,.05); --panel-blur:none;
  --row-green:#ecfdf5; --row-yellow:#fffbeb; --row-blue:#eff6ff;
  --cta-bg:#eff6ff; --cta-done-bg:#ecfdf5;
  --key-active:#e2e8f0;
  --fixed-bar:#7c3aed;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#09090b; --card:rgba(24,24,27,.7); --line:rgba(168,85,247,.22); --line-soft:rgba(255,255,255,.08); --chip:rgba(255,255,255,.06);
    --ink:#f4f4f5; --muted:#a1a1aa;
    --accent:#c084fc; --accent-ink:#1e1033;
    --save:#34d399; --save-bg:rgba(52,211,153,.12);
    --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12);
    --bad:#f87171; --bad-bg:rgba(248,113,113,.14);
    --btn-bg:#7c3aed; --btn-fg:#ffffff;
    --hero-bg:rgba(24,24,27,.85); --hero-fg:#f4f4f5; --hero-muted:#a1a1aa;
    --panel-shadow:0 0 20px rgba(168,85,247,.15); --panel-blur:blur(14px);
    --row-green:rgba(52,211,153,.1); --row-yellow:rgba(251,191,36,.1); --row-blue:rgba(96,165,250,.1);
    --cta-bg:rgba(192,132,252,.08); --cta-done-bg:rgba(52,211,153,.08);
    --key-active:rgba(192,132,252,.15);

}
:root[data-theme="dark"]{
  --paper:#09090b; --card:rgba(24,24,27,.7); --line:rgba(168,85,247,.22); --line-soft:rgba(255,255,255,.08); --chip:rgba(255,255,255,.06);
  --ink:#f4f4f5; --muted:#a1a1aa;
  --accent:#c084fc; --accent-ink:#1e1033;
  --save:#34d399; --save-bg:rgba(52,211,153,.12);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.12);
  --bad:#f87171; --bad-bg:rgba(248,113,113,.14);
  --btn-bg:#7c3aed; --btn-fg:#ffffff;
  --hero-bg:rgba(24,24,27,.85); --hero-fg:#f4f4f5; --hero-muted:#a1a1aa;
  --panel-shadow:0 0 20px rgba(168,85,247,.15); --panel-blur:blur(14px);
  --row-green:rgba(52,211,153,.1); --row-yellow:rgba(251,191,36,.1); --row-blue:rgba(96,165,250,.1);
  --cta-bg:rgba(192,132,252,.08); --cta-done-bg:rgba(52,211,153,.08);

}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;transition:background .2s,color .2s}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.025em;font-weight:600}
button,select,input{font:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Päis — sulandub lehe taustaga, minimalistlik */
.topbar{background:var(--paper);color:var(--ink);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:1.25rem;letter-spacing:-.03em}

.navbtn{display:flex;align-items:center;gap:.4rem;padding:.45rem .8rem;border-radius:999px;color:var(--muted);font-size:.88rem;white-space:nowrap}
.navbtn:hover{color:var(--ink);background:var(--chip)}
.navbtn.on{background:var(--btn-bg);color:var(--btn-fg);font-weight:600}
.theme-toggle{position:relative;width:2.75rem;height:1.5rem;border-radius:999px;background:var(--chip);border:1px solid var(--line);flex-shrink:0;cursor:pointer}
.theme-toggle .thumb{position:absolute;top:1px;left:1px;width:1.15rem;height:1.15rem;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .18s ease,background .18s ease}
.theme-toggle[aria-checked="true"]{background:rgba(168,85,247,.22)}
.theme-toggle[aria-checked="true"] .thumb{transform:translateX(1.2rem);background:#c084fc}

/* Kaardid — pehme vari, õrn äär, vertikaalne voog */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.25rem;box-shadow:var(--panel-shadow);backdrop-filter:var(--panel-blur);-webkit-backdrop-filter:var(--panel-blur)}
.card-title{display:flex;justify-content:space-between;align-items:baseline;gap:.5rem;font-weight:650;font-size:1rem;margin-bottom:.9rem}
.hero{background:var(--hero-bg);color:var(--hero-fg);border:1px solid var(--line);border-radius:24px;box-shadow:var(--panel-shadow);backdrop-filter:var(--panel-blur);-webkit-backdrop-filter:var(--panel-blur)}
.hero .muted{color:var(--hero-muted)}
.bigno{font-size:clamp(2.8rem,9vw,4.2rem);font-weight:800;line-height:1;letter-spacing:-.045em}
.pos{color:#9ae6b4}.neg{color:#fc8181!important}
.card .neg{color:var(--bad)!important}
.hero .neg{color:#fc8181!important}

.track{background:var(--chip)}

/* Päevariba — igal tulbal all päevanumber */
.daystrip{display:flex;gap:3px;align-items:flex-end;height:58px}
.daycol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.daycol i{display:block;width:100%;border-radius:3px 3px 0 0;background:rgba(255,255,255,.15);min-height:4px}

/* Vormid ja nupud */
.lbl{display:block;font-size:.8rem;color:var(--muted);margin-bottom:.25rem}
.input{width:100%;border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;background:var(--card);color:var(--ink)}
.input-sm{padding:.3rem .45rem;font-size:.85rem}
.input-ghost{border-color:transparent;padding-left:0;font-weight:600}
.input-ghost:hover,.input-ghost:focus{border-color:var(--line);padding-left:.5rem}
.input-warn{border-color:var(--warn);background:var(--warn-bg)}
.swatch{width:2.2rem;height:2rem;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--card)}
input[type=range]{accent-color:var(--accent);height:1.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.55rem 1rem;border-radius:10px;font-weight:600;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn-dark{background:var(--btn-bg);color:var(--btn-fg)}.btn-dark:hover{filter:brightness(1.12)}
.btn-sea{background:var(--accent);color:var(--accent-ink)}.btn-sea:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}.btn-ghost:hover{background:var(--chip)}
.btn-sm{padding:.3rem .6rem;font-size:.8rem}
.armed{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important}
.icon-btn{width:1.8rem;height:1.8rem;border-radius:999px;color:var(--muted)}
.icon-btn:hover{background:var(--bad-bg);color:var(--bad)}
.link{color:var(--accent);font-size:.85rem;font-weight:600}
.link-danger{color:var(--muted)}.link-danger:hover{color:var(--bad)}
.dot{display:inline-block;width:.55rem;height:.55rem;border-radius:999px;vertical-align:middle}

/* Monogramm — kategooria "ikoon" ilma emotikonita */
.mono-badge{display:inline-flex;align-items:center;justify-content:center;width:1.9rem;height:1.9rem;border-radius:8px;font-weight:700;flex-shrink:0;font-size:.85rem}
.mono-badge.lg{width:3rem;height:3rem;font-size:1.2rem;border-radius:12px}

/* Maksa esmalt endale */
.cta{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;justify-content:space-between;border-radius:12px;padding:1rem;background:var(--cta-bg);border-left:5px solid var(--accent)}
.cta-done{background:var(--cta-done-bg);border-left-color:var(--save)}
.cta strong{font-size:1.1rem}

/* Kiirlisaja */
.kp-display{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;background:rgba(255,255,255,.07);border-radius:14px;padding:.4rem .8rem}
.key{height:4rem;border-radius:18px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:1.6rem;font-weight:600;touch-action:manipulation;transition:background .12s,border-color .12s}
.key:hover{background:var(--chip);border-color:var(--accent)}
.key:active{background:var(--key-active);transform:scale(.96)}
.catbtn{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding:.8rem .4rem;border-radius:14px;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--c);touch-action:manipulation;transition:opacity .15s}
.catbtn:active{transform:scale(.97)}
.catbtn.dim{opacity:.4}

/* Import ja tabel */
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:1.6rem;text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
.dropzone:hover{background:var(--chip)}
.drop-active{border-color:var(--accent);background:var(--chip)}
.chip{padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line);font-size:.82rem;background:var(--card);color:var(--ink)}
.chip.on{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.tbl{width:100%;font-size:.88rem;border-collapse:collapse}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
.tbl td{padding:.5rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.row-green td{background:var(--row-green)}
.row-yellow td{background:var(--row-yellow)}
.row-blue td{background:var(--row-blue)}
.rule{font-family:inherit;font-weight:700;font-size:.8rem;background:var(--chip);color:var(--ink);border-radius:6px;padding:.15rem .45rem}
.formula{font-size:1.15rem;font-weight:600;background:var(--chip);color:var(--ink);border-radius:8px;padding:.6rem .8rem;display:inline-block}
.axis{font-size:10px;fill:var(--muted)}
.bar-fill{transition:width .25s ease}
.tx-divide>*+*{border-top:1px solid var(--line-soft)}

/* Teade */
.toast{position:fixed;left:50%;bottom:1.5rem;z-index:50;max-width:min(92vw,560px);display:flex;gap:.8rem;align-items:center;background:#0f172a;color:#fff;padding:.7rem 1rem;border-radius:12px;font-size:.9rem;box-shadow:0 10px 30px rgba(20,33,61,.3);opacity:0;pointer-events:none;transform:translate(-50%,12px);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast-error{background:#dc2626}
.toast button{color:#a78bfa;font-weight:700;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app"><p style="padding:2rem;text-align:center">Laadin andmeid…</p></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   THE QUANT BUDGET & INVESTMENT ARCHITECT — v2.1 (Local-First)
   1) Konstandid ja abifunktsioonid
   2) Andmekiht (Store): ainult brauseri localStorage (Local-First)
      Supabase lisamiseks tuleb vahetada ainult Store.load / Store.write.
   3) Skeem ja migratsioon (andmete ohutu uuendamine) + kuude ajaloo arhiveerimine
   4) Arvutusmootor calc(kuuvõti) – ainus tõe allikas kõigile numbritele.
      Toetab jooksvat KUI ka ajaloolisi kuid (ajalooline kuu loeb state.history snapshotti).
   5) Pangatoru: CSV → normalizeBankRows → ingestBankRows
      Open Banking / webhook kutsub tulevikus sama ingestBankRows().
   6) Reeglite mootor   7) Vaated (sh kuude ajalugu ja säästueesmärkide portfell)   8) Tegevused ja sündmused
   ===================================================================== */

/* ---------- 1. KONSTANDID JA ABIFUNKTSIOONID ---------- */
const APP_KEY = 'qba-state-v1';
const SCHEMA_VERSION = 1;
const FALLBACK_CAT = 'fun';
const INFLATION_RATE = 2.5;
const MONTHS_ET = ['jaanuar', 'veebruar', 'märts', 'aprill', 'mai', 'juuni', 'juuli', 'august', 'september', 'oktoober', 'november', 'detsember'];
const PALETTE = ['#1f6f8b', '#2f855a', '#b7791f', '#6b46c1', '#c05621', '#2b6cb0', '#b83280', '#4a5568'];
const UNCAT = { id: null, name: 'Kategoriseerimata', color: '#e9b949' };

const DEFAULT_CATEGORIES = [
  { id: 'food', name: 'Toit', color: '#2f855a', daily: true },
  { id: 'transport', name: 'Transport', color: '#2b6cb0', daily: true },
  { id: 'fun', name: 'Meelelahutus/Muu', color: '#b7791f', daily: true },
  { id: 'fixed', name: 'Püsikulud', color: '#6b46c1', daily: false }
];
const DEFAULT_ALLOCATIONS = [
  { id: 'invest', name: 'Investeeringud', pct: 15, invest: true },
  { id: 'travel', name: 'Reisimine', pct: 5, invest: false },
  { id: 'purchase', name: 'Suurem ost', pct: 5, invest: false },
  { id: 'buffer', name: 'Meelerahufond', pct: 5, invest: false }
];
const DEFAULT_RULES = [['RIMI', 'food'], ['SELVER', 'food'], ['PRISMA', 'food'], ['MAXIMA', 'food'], ['LIDL', 'food'],
  ['BOLT', 'transport'], ['ELRON', 'transport'], ['TELIA', 'fixed'], ['ELEKTRILEVI', 'fixed']]
  .map(([pattern, cat]) => ({ id: 'r-' + pattern.toLowerCase(), pattern, cat }));

const VIEWS = [
  { id: 'dashboard', label: 'Ülevaade' },
  { id: 'quick', label: 'Kiirlisaja' },
  { id: 'strategy', label: 'Strateegiatuba' },
  { id: 'settings', label: 'Seaded' }
];
const FILTERS = {
  all: ['Kõik', () => true],
  ok: ['Kinnitatud', t => t.reconciled],
  unknown: ['Tundmatud', t => t.cat === null],
  pending: ['Ootavad panka', t => t.source === 'manual' && !t.reconciled],
  bank: ['Ainult pangast', t => t.source === 'bank' && t.cat !== null]
};

const CHECK_SVG = '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline-block;vertical-align:-2px"><path d="M4 10.5l4 4 8-9"/></svg>';

const clone = o => JSON.parse(JSON.stringify(o));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = (v, d = 0) => {
  let s = String(v ?? '').replace(/\s/g, '');
  if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '');
  const n = parseFloat(s.replace(',', '.'));
  return Number.isFinite(n) ? n : d;
};
const round2 = n => Math.round(n * 100) / 100;
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const EUR = new Intl.NumberFormat('et-EE', { style: 'currency', currency: 'EUR' });
const eur = n => EUR.format(round2(n || 0));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoDate(new Date());
const monthKey = (iso = todayISO()) => iso.slice(0, 7);
const daysInMonth = key => { const [y, m] = key.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const dayDiff = (a, b) => Math.round((Date.parse(a) - Date.parse(b)) / 864e5);
const pctOf = (a, b) => (b > 0 ? clamp(a / b * 100, 0, 100) : (a > 0 ? 100 : 0));
const fmtDay = iso => `${+iso.slice(8, 10)}.${+iso.slice(5, 7)}`;
const monthLabel = key => { const [y, m] = key.split('-').map(Number); const s = `${MONTHS_ET[m - 1]} ${y}`; return s[0].toUpperCase() + s.slice(1); };
const nTx = n => `${n} ${n === 1 ? 'tehing' : 'tehingut'}`;
const byDateDesc = (a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id));
// Hex värv + läbipaistvus -> rgba() string (kategooria monogrammi taustaks; ei sõltu CSS var() toest atribuutides)
const hexA = (hex, a) => {
  const h = String(hex || '#94a3b8').replace('#', '');
  const n = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  const r = parseInt(n.slice(0, 2), 16) || 148, g = parseInt(n.slice(2, 4), 16) || 163, b = parseInt(n.slice(4, 6), 16) || 184;
  return `rgba(${r},${g},${b},${a})`;
};

/* ---------- 2. ANDMEKIHT (ainult lokaalne) ---------- */
// Andmed salvestatakse AINULT selle brauseri localStorage'isse. Midagi ei saadeta välja.
let saveOk = null;
const TEMP_LABEL = 'ajutine mälu (andmed kaovad lehe sulgemisel)';
const Store = {
  backend: TEMP_LABEL, timer: null, pending: null,
  load() {
    let raw = null;
    try { raw = localStorage.getItem(APP_KEY); this.backend = 'brauseri localStorage'; } catch (e) { return null; }
    try { return raw ? JSON.parse(raw) : null; }
    catch (e) { // rikutud andmed: jäta koopia alles, et midagi kaotsi ei läheks
      try { localStorage.setItem(APP_KEY + '-rikutud', raw); } catch (_) { /* pole ruumi */ }
      return null;
    }
  },
  save(data) {
    this.pending = data;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.flush(), 300);
  },
  flush() {
    if (!this.pending) return;
    clearTimeout(this.timer);
    this.write(JSON.stringify(this.pending));
    this.pending = null;
  },
  write(json) {
    let ok = false;
    try { localStorage.setItem(APP_KEY, json); ok = true; } catch (e) { /* blokeeritud või mälu täis */ }
    this.backend = ok ? 'brauseri localStorage' : TEMP_LABEL;
    setSaveStatus(ok);
  },
  clear() {
    this.pending = null;
    clearTimeout(this.timer);
    try { localStorage.removeItem(APP_KEY); } catch (e) { /* pole saadaval */ }
  }
};
// Salvesta viimane muudatus ka siis, kui vaheleht suletakse kohe pärast klõpsu
window.addEventListener('pagehide', () => Store.flush());

/* ---------- 3. SKEEM JA MIGRATSIOON ---------- */
const defaultState = () => ({
  schema: SCHEMA_VERSION,
  income: 1000,
  fixedPlan: 40,
  returnRate: 8,
  allocations: clone(DEFAULT_ALLOCATIONS),
  categories: clone(DEFAULT_CATEGORIES),
  tx: [],
  rules: clone(DEFAULT_RULES),
  transfers: {},
  history: {},
  ui: {
    view: 'dashboard', filter: 'all', simFormat: 'swedbank', inflation: false,
    liveMonth: monthKey(), viewMonth: monthKey(),
    theme: (typeof matchMedia === 'function' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'
  }
});

function migrate(raw) {
  const base = defaultState();
  if (!raw || typeof raw !== 'object') return base;
  const s = { ...base, ...raw, ui: { ...base.ui, ...(raw.ui || {}) } };
  for (const k of ['allocations', 'categories', 'tx', 'rules']) if (!Array.isArray(s[k])) s[k] = clone(base[k]);
  s.income = Math.max(0, num(s.income, base.income));
  s.fixedPlan = Math.max(0, num(s.fixedPlan, base.fixedPlan));
  s.returnRate = clamp(num(s.returnRate, 8), 0, 30);

  // Ülekanded: vanem kuju oli puhas tõeväärtus (true/false), uus kuju kannab ka tegelikku ülekantud summat
  s.transfers = s.transfers && typeof s.transfers === 'object' ? s.transfers : {};
  for (const mk of Object.keys(s.transfers)) {
    const v = s.transfers[mk];
    if (typeof v === 'boolean') s.transfers[mk] = { done: v, amount: 0 };
    else if (v && typeof v === 'object') s.transfers[mk] = { done: !!v.done, amount: Math.max(0, num(v.amount, 0)) };
    else delete s.transfers[mk];
  }

  // Kuude ajalugu: iga kirje jäädvustab mingil minevikukuul kehtinud tulu/püsikulud/eesmärgid
  s.history = s.history && typeof s.history === 'object' ? s.history : {};
  for (const mk of Object.keys(s.history)) {
    const h = s.history[mk];
    if (!/^\d{4}-\d{2}$/.test(mk) || !h || typeof h !== 'object' || !Array.isArray(h.allocations)) { delete s.history[mk]; continue; }
    s.history[mk] = {
      income: Math.max(0, num(h.income, 0)),
      fixedPlan: Math.max(0, num(h.fixedPlan, 0)),
      allocations: h.allocations.filter(a => a && a.id).map(a => ({ name: 'Eesmärk', invest: false, pct: 0, ...a }))
    };
  }

  s.categories = s.categories.filter(c => c && c.id)
    .map((c, i) => ({ color: PALETTE[i % PALETTE.length], daily: true, ...c, name: String(c.name || 'Nimetu') }));
  if (!s.categories.some(c => c.id === FALLBACK_CAT)) s.categories.push(clone(DEFAULT_CATEGORIES.find(c => c.id === FALLBACK_CAT)));
  const ids = new Set(s.categories.map(c => c.id));

  s.tx = s.tx.filter(t => t && t.id && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && num(t.amount) > 0)
    .map(t => ({ source: 'manual', reconciled: false, merchant: '', note: '', ...t,
      amount: round2(num(t.amount)), cat: t.cat === null ? null : (ids.has(t.cat) ? t.cat : FALLBACK_CAT) }));
  s.rules = s.rules.filter(r => r && r.pattern && ids.has(r.cat))
    .map(r => ({ id: r.id || 'r-' + uid(), pattern: String(r.pattern).toUpperCase().trim(), cat: r.cat }));

  let left = 100;
  s.allocations = s.allocations.filter(a => a && a.id).map(a => {
    const pct = clamp(Math.round(num(a.pct)), 0, left);
    left -= pct;
    return { name: 'Eesmärk', invest: false, ...a, pct };
  });
  if (!FILTERS[s.ui.filter]) s.ui.filter = 'all';
  if (!VIEWS.some(v => v.id === s.ui.view)) s.ui.view = 'dashboard';
  if (s.ui.theme !== 'light' && s.ui.theme !== 'dark') s.ui.theme = base.ui.theme;
  s.ui.inflation = !!s.ui.inflation;
  if (!/^\d{4}-\d{2}$/.test(s.ui.liveMonth)) s.ui.liveMonth = monthKey();
  if (!/^\d{4}-\d{2}$/.test(s.ui.viewMonth)) s.ui.viewMonth = s.ui.liveMonth;
  s.schema = SCHEMA_VERSION;
  return s;
}

/* Kui rakendus avatakse uuel kalendrikuul, jäädvustatakse eelmise kuu sätted (tulu, püsikulud,
   eesmärkide protsendid) muutumatuna ajalukku, enne kui kasutaja need uue kuu jaoks üle kirjutab. */
function rolloverIfNeeded() {
  const mk = monthKey();
  if (state.ui.liveMonth === mk) return;
  const wasViewingLive = state.ui.viewMonth === state.ui.liveMonth;
  if (state.ui.liveMonth) {
    state.history[state.ui.liveMonth] = { income: state.income, fixedPlan: state.fixedPlan, allocations: clone(state.allocations) };
  }
  state.ui.liveMonth = mk;
  if (wasViewingLive || !state.ui.viewMonth) state.ui.viewMonth = mk;
}

// Kõik kuud, mida saab vaadata: jooksev kuu + ajalukku salvestatud kuud + kuud, millel on tehinguid
function availableMonths() {
  const set = new Set([monthKey(), ...Object.keys(state.history)]);
  for (const t of state.tx) set.add(monthKey(t.date));
  return [...set].sort().reverse();
}

/* ---------- 4. ARVUTUSMOOTOR ---------- */
// mk puudumisel kasutatakse hetkel valitud vaate kuud (state.ui.viewMonth) või jooksvat kuud.
// Ajaloolise kuu puhul loetakse tulu/püsikulud/eesmärgid sellel hetkel arhiveeritud väärtustest (state.history).
function calc(mk = state.ui.viewMonth || monthKey()) {
  const isLive = mk === monthKey();
  const snap = isLive ? null : state.history[mk];
  const income = snap ? snap.income : state.income;
  const fixedPlan = snap ? snap.fixedPlan : state.fixedPlan;
  const allocations = snap ? snap.allocations : state.allocations;
  const dim = daysInMonth(mk), day = isLive ? new Date().getDate() : dim, t0 = todayISO();
  const savingsPct = allocations.reduce((a, x) => a + x.pct, 0);
  const savings = round2(income * savingsPct / 100);
  const invest = round2(allocations.reduce((a, x) => a + (x.invest ? income * x.pct / 100 : 0), 0));
  const rawPool = income - savings - fixedPlan;
  const dailyPool = Math.max(0, rawPool);
  const base = dailyPool / dim;
  const dailyCats = new Set(state.categories.filter(c => c.daily).map(c => c.id));
  const monthTx = state.tx.filter(t => monthKey(t.date) === mk);
  const byCat = {}, perDay = Array(dim).fill(0);
  let spentBefore = 0, spentToday = 0, spentDaily = 0, spentFixed = 0;

  for (const t of monthTx) {
    const key = t.cat ?? '';
    byCat[key] = (byCat[key] || 0) + t.amount;
    if (t.cat !== null && !dailyCats.has(t.cat)) { spentFixed += t.amount; continue; }
    spentDaily += t.amount;
    perDay[+t.date.slice(8) - 1] += t.amount;
    if (t.date < t0) spentBefore += t.amount;
    else if (t.date === t0) spentToday += t.amount;
  }
  // Ümbrikumudel: tänane limiit = baas × päevanumber − varem kulutatu (ülejääk kandub edasi)
  const todayLimit = base * day - spentBefore;
  const daysLeft = dim - day + 1;
  const poolLeft = dailyPool - spentDaily;
  return {
    mk, dim, day, isLive, income, fixedPlan, allocations, daysLeft, savingsPct, savings, invest, rawPool, dailyPool, base,
    monthTx, byCat, perDay, spentToday, spentDaily, spentFixed, todayLimit, leftToday: todayLimit - spentToday, carry: todayLimit - base,
    poolLeft, compass: poolLeft / daysLeft, surplus: Math.max(0, base * day - spentDaily),
    total: spentDaily + spentFixed
  };
}

// Annuiteedi tulevikuväärtus: FV = P × ((1 + r)^n − 1) / r, igakuine liitintress
const fv = (pmt, years, ratePct) => {
  const r = ratePct / 100 / 12, n = years * 12;
  return r ? pmt * (Math.pow(1 + r, n) - 1) / r : pmt * n;
};

/* ---------- 5. PANGATORU ---------- */
function parseCSV(text) {
  text = String(text).replace(/^﻿/, '');
  const head = text.split(/\r?\n/, 1)[0];
  const delim = (head.match(/;/g) || []).length >= (head.match(/,/g) || []).length ? ';' : ',';
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch !== '"') field += ch;
      else if (text[i + 1] === '"') { field += '"'; i++; }
      else quoted = false;
    } else if (ch === '"') quoted = true;
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(f => f.trim()));
}

function parseDate(s = '') {
  s = String(s).trim();
  let m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
  if (m) return `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? `${m[1]}-${m[2]}-${m[3]}` : null;
}

// Tunneb ära Swedbanki (;) ja LHV (,) väljavõtte päised. Tagastab ainult väljaminekud.
function normalizeBankRows(rows) {
  if (!rows.length) throw new Error('Fail on tühi.');
  const head = rows[0].map(h => h.trim().toLowerCase());
  const find = (...res) => { for (const re of res) { const i = head.findIndex(h => re.test(h)); if (i > -1) return i; } return -1; };
  const col = {
    date: find(/^kuupäev$/, /kuup/, /date/),
    amount: find(/^summa$/, /summa/, /amount/),
    name: find(/saaja\/maksja nimi/, /^saaja\/maksja$/, /nimi/, /payee|counterparty/),
    desc: find(/selgitus/, /description|details/),
    dc: find(/deebet|kreedit|d\/c/),
    type: find(/reatüüp/),
    ref: find(/arhii?v/, /tehingu id/)
  };
  if (col.date < 0 || col.amount < 0) throw new Error('CSV päisest ei leitud kuupäeva või summa veergu. Kasuta Swedbanki või LHV väljavõtet.');
  const cell = (r, i) => (i > -1 && r[i] != null ? String(r[i]).trim() : '');

  return rows.slice(1).map(r => {
    if (col.type > -1 && cell(r, col.type) !== '20') return null; // Swedbank: 20 = tehing, muud = saldod
    const date = parseDate(cell(r, col.date));
    const raw = num(cell(r, col.amount), NaN);
    if (!date || !Number.isFinite(raw) || raw === 0) return null;
    const dc = cell(r, col.dc).toUpperCase();
    if (dc ? dc !== 'D' : raw > 0) return null; // tulud jäävad v1-s välja
    const desc = cell(r, col.desc);
    const merchant = cell(r, col.name) || desc || 'Tundmatu saaja';
    return { date, amount: round2(Math.abs(raw)), merchant, desc, ref: cell(r, col.ref) || `${date}|${raw}|${merchant}` };
  }).filter(Boolean);
}

// ÜKS sisenemispunkt kõigile pangaandmetele (CSV, simulatsioon, tulevikus Open Banking)
function ingestBankRows(rows) {
  const stats = { matched: 0, ruled: 0, unknown: 0, dup: 0 };
  const seen = new Set(state.tx.map(t => t.bankRef).filter(Boolean));
  for (const r of rows) {
    if (seen.has(r.ref)) { stats.dup++; continue; }
    seen.add(r.ref);
    const match = findManualMatch(r);
    if (match) {
      Object.assign(match, { reconciled: true, source: 'merged', merchant: r.merchant, bankDate: r.date, bankRef: r.ref });
      stats.matched++;
      continue;
    }
    const cat = ruleFor(r.merchant);
    state.tx.push({ id: uid(), date: r.date, amount: r.amount, cat, note: r.desc, merchant: r.merchant,
      source: 'bank', reconciled: false, bankRef: r.ref, byRule: !!cat });
    cat ? stats.ruled++ : stats.unknown++;
  }
  commit();
  return stats;
}

// Sama summa (sendi täpsusega) ja kuni ±3 päeva vahe; valitakse kuupäevalt lähim
function findManualMatch(r) {
  return state.tx
    .filter(t => t.source === 'manual' && !t.reconciled && Math.abs(t.amount - r.amount) < 0.005 && Math.abs(dayDiff(t.date, r.date)) <= 3)
    .sort((a, b) => Math.abs(dayDiff(a.date, r.date)) - Math.abs(dayDiff(b.date, r.date)))[0];
}

/* ---------- 6. REEGLITE MOOTOR ---------- */
function merchantKey(m) {
  const words = String(m).toUpperCase().replace(/[^A-Z0-9ÕÄÖÜŠŽ]+/g, ' ').trim().split(' ');
  return (words[0] || '').length < 3 ? words.slice(0, 2).join(' ') : words[0];
}
function ruleFor(merchant) {
  const M = String(merchant).toUpperCase();
  const hit = state.rules.filter(r => M.includes(r.pattern)).sort((a, b) => b.pattern.length - a.pattern.length)[0];
  return hit ? hit.cat : null;
}
function upsertRule(pattern, cat) {
  pattern = String(pattern || '').trim().toUpperCase();
  if (!pattern || !cat) return false;
  const r = state.rules.find(x => x.pattern === pattern);
  if (r) r.cat = cat; else state.rules.push({ id: 'r-' + uid(), pattern, cat });
  return true;
}
function applyRules() {
  let n = 0;
  for (const t of state.tx) {
    if (t.cat !== null || !t.merchant) continue;
    const c = ruleFor(t.merchant);
    if (c) { t.cat = c; t.byRule = true; n++; }
  }
  return n;
}
function setTxCategory(id, catId) {
  const t = state.tx.find(x => x.id === id);
  if (!t) return;
  t.cat = catId || null;
  t.byRule = false;
  let msg = 'Kategooria muudetud.';
  const key = t.cat && t.merchant ? merchantKey(t.merchant) : '';
  if (key && upsertRule(key, t.cat)) {
    const n = applyRules();
    msg = `Õpitud reegel: „${key}“ on nüüd ${getCat(t.cat).name}.${n ? ` Lisaks sai kategooria veel ${nTx(n)}.` : ''}`;
  }
  commit();
  toast(msg);
}

/* ---------- 7. VAATED ---------- */

}

function dayStrip(c) {
  const todayIdx = c.day - 1;
  const cols = c.perDay.map((v, i) => {
    const h = i > todayIdx ? 12 : clamp(c.base > 0 ? 20 + (v / c.base) * 40 : 20, 12, 100);
    const cls = i > todayIdx ? '' : (v <= c.base ? 'ok' : 'over');
    const showNum = i === 0 || i === c.dim - 1 || i === todayIdx || (i + 1) % 5 === 0;
    return `<div class="daycol">
      <i class="${cls} ${i === todayIdx ? 'today' : ''}" style="height:${h}%" title="${i + 1}. päev: ${eur(v)}"></i>
      <span class="day-num" style="${i === todayIdx ? 'color:var(--accent);font-weight:700' : ''}">${showNum ? i + 1 : ''}</span>
    </div>`;
  }).join('');
  return `<div class="daystrip" aria-label="Kuu päevad: roheline = limiidi sees, punane = üle limiidi, number all näitab kuupäeva">${cols}</div>`;
}

function pieSVG(slices, emptyMsg = 'Kulusid veel pole.') {
  const total = slices.reduce((a, s) => a + s.value, 0);
  if (!total) return `<div class="h-44 flex items-center text-sm muted">${emptyMsg}</div>`;
  const cs = getComputedStyle(document.documentElement);
  const inkC = (cs.getPropertyValue('--ink') || '#0f172a').trim();
  const mutedC = (cs.getPropertyValue('--muted') || '#475569').trim();
  const cardC = (cs.getPropertyValue('--card') || '#ffffff').trim();
  const R = 80, C = 90;
  let a0 = -Math.PI / 2;
  const parts = slices.map(s => {
    const frac = s.value / total;
    if (frac > 0.9999) return `<circle cx="${C}" cy="${C}" r="${R}" fill="${s.color}"><title>${esc(s.label)}</title></circle>`;
    const a1 = a0 + frac * 2 * Math.PI;
    const p = a => `${(C + R * Math.cos(a)).toFixed(2)},${(C + R * Math.sin(a)).toFixed(2)}`;
    const d = `M${C},${C} L${p(a0)} A${R},${R} 0 ${frac > 0.5 ? 1 : 0} 1 ${p(a1)} Z`;
    a0 = a1;
    return `<path d="${d}" fill="${s.color}" stroke="${cardC}" stroke-width="2"><title>${esc(s.label)}: ${eur(s.value)}</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 180 180" class="w-44 h-44" role="img" aria-label="Jaotuse diagramm">${parts}
    <circle cx="90" cy="90" r="48" fill="${cardC}"/>
    <text x="90" y="86" text-anchor="middle" font-size="10" fill="${mutedC}">Kokku</text>
    <text x="90" y="104" text-anchor="middle" font-size="15" font-weight="700" fill="${inkC}">${eur(total)}</text></svg>`;
}

/* Kuude ajalugu: säästueesmärkide portfell (kumulatiivne) ja tegeliku investeeringu täitumus */
function portfolioTotals() {
  const totals = {};
  const add = (income, allocations) => {
    for (const a of allocations) {
      const amt = round2(income * a.pct / 100);
      const row = totals[a.id] || (totals[a.id] = { id: a.id, name: a.name, invest: a.invest, total: 0 });
      row.total = round2(row.total + amt);
      row.name = a.name;
      row.invest = a.invest;
    }
  };
  for (const snap of Object.values(state.history)) add(snap.income, snap.allocations);
  add(state.income, state.allocations); // jooksva kuu plaanitud panus loetakse juba kaasa
  return Object.values(totals).sort((a, b) => b.total - a.total);
}

function investedTotals() {
  let planned = 0;
  const add = (income, allocations) => {
    planned = round2(planned + allocations.filter(a => a.invest).reduce((s, a) => s + income * a.pct / 100, 0));
  };
  for (const snap of Object.values(state.history)) add(snap.income, snap.allocations);
  add(state.income, state.allocations);
  const actual = round2(Object.values(state.transfers).reduce((s, t) => s + (t && t.done ? (t.amount || 0) : 0), 0));
  return { planned, actual };
}

function portfolioCard() {
  const totals = portfolioTotals();
  const grand = totals.reduce((s, a) => s + a.total, 0);
  const colored = totals.map((a, i) => ({ ...a, color: PALETTE[i % PALETTE.length] }));
  const slices = colored.map(a => ({ label: a.name, color: a.color, value: a.total }));
  const rows = colored.map(a => `
    <div class="flex items-center gap-2">
      <span class="mono-badge" style="background:${hexA(a.color, .16)};color:${a.color}" aria-hidden="true">${esc(a.name.charAt(0).toUpperCase())}</span>
      <div class="flex-1"><div class="flex justify-between text-sm"><span>${esc(a.name)}${a.invest ? ' <span class="text-xs muted">· investeering</span>' : ''}</span><span class="num font-semibold">${eur(a.total)}</span></div>
      ${bar(`${pctOf(a.total, grand)}%`, a.color, '', 'h-1')}</div>
    </div>`).join('');
  return card('Säästueesmärkide portfell', `
    <p class="text-sm muted mb-2">Kõigi kuude (sh jooksva) plaanitud säästude kogusumma eesmärkide kaupa.</p>
    <div class="flex justify-center">${pieSVG(slices, 'Eesmärke pole veel seadistatud.')}</div>
    <div class="mt-4 space-y-2">${rows || '<p class="text-sm muted text-center py-4">Eesmärke pole veel seadistatud.</p>'}</div>
    <p class="text-sm mt-3 pt-3" style="border-top:1px solid var(--line-soft)">Kokku plaani järgi kogutud: <b class="num">${eur(grand)}</b></p>`, 'lg:col-span-2');
}

function investedStat() {
  const { planned, actual } = investedTotals();
  const pct = pctOf(actual, planned);
  return `<div class="flex flex-wrap items-end justify-between gap-4 mb-5 pb-5" style="border-bottom:1px solid var(--line-soft)">
    <div><div class="text-xs muted">Tegelikult investeeritud (kinnitatud ülekanded)</div><div class="num text-2xl font-bold" style="color:var(--save)">${eur(actual)}</div></div>

function fvChart(series, rate, years = 10) {
  const cs = getComputedStyle(document.documentElement);
  const lineC = (cs.getPropertyValue('--line') || '#e2e8f0').trim();
  const W = 360, H = 210, L = 46, R = 12, T = 10, B = 24;
  const pts = series.map(s => Array.from({ length: years + 1 }, (_, y) => fv(s.p, y, rate)));
  const max = Math.max(1, ...pts.flat());
  const x = i => L + i * (W - L - R) / years;
  const y = v => T + (1 - v / max) * (H - T - B);
  const k = v => (v >= 1000 ? `${Math.round(v / 1000)} tuh` : Math.round(v));
  const grid = [0, 0.5, 1].map(f => `<line x1="${L}" x2="${W - R}" y1="${y(max * f)}" y2="${y(max * f)}" stroke="${lineC}"/>
    <text x="${L - 6}" y="${y(max * f) + 3}" text-anchor="end" class="axis">${k(max * f)} €</text>`).join('');
  const xl = [0, 5, 10].map(i => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" class="axis">${i} a</text>`).join('');
  const lines = pts.map((p, si) => `<polyline fill="none" stroke="${series[si].hex}" stroke-width="2.5" stroke-linejoin="round" points="${p.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>` +
    [5, 10].map(i => `<circle cx="${x(i)}" cy="${y(p[i])}" r="4" fill="${series[si].hex}"><title>${i} aastat: ${eur(p[i])}</title></circle>`).join('')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full" role="img" aria-label="Säästude kasv 10 aasta jooksul">${grid}${xl}${lines}</svg>`;
}

/* Vaade 4: Seaded */
function viewSettings() {
  const cats = state.categories.map(cat => `
    <div class="flex flex-wrap items-center gap-2 py-2" style="border-bottom:1px solid var(--line-soft)">
      ${monogram(cat)}
      <input id="cn-${cat.id}" class="input input-sm flex-1 min-w-0" value="${esc(cat.name)}" data-cat-field="name" data-id="${cat.id}" aria-label="Nimi">
      <input type="color" class="swatch" value="${cat.color}" data-cat-field="color" data-id="${cat.id}" aria-label="Värv">
      <label class="text-xs flex items-center gap-1"><input type="checkbox" data-cat-field="daily" data-id="${cat.id}" ${cat.daily ? 'checked' : ''}> Päevalimiidis</label>
      ${cat.id === FALLBACK_CAT ? '<span class="text-xs muted" style="width:4.6rem;text-align:center">varukategooria</span>'
        : `<button data-action="delCat" data-id="${cat.id}" class="btn btn-ghost btn-sm" style="width:4.6rem">Kustuta</button>`}
    </div>`).join('');

  const catCard = card('Kategooriad', `
    <p class="text-sm muted mb-2">„Päevalimiidis“ tähendab, et kulu vähendab päevalimiiti. Ilma linnukeseta kulud (nt üür) arvestatakse püsikulude plaanist.</p>
    ${cats}
    <div class="flex flex-wrap items-end gap-2 mt-4">
      <input id="nc-name" class="input input-sm flex-1 min-w-0" placeholder="Uue kategooria nimi" aria-label="Uue kategooria nimi">
      <input id="nc-color" type="color" class="swatch" value="${PALETTE[state.categories.length % PALETTE.length]}" aria-label="Uue kategooria värv">
      <label class="text-xs flex items-center gap-1"><input id="nc-daily" type="checkbox" checked> Päevalimiidis</label>
      <button data-action="addCat" class="btn btn-dark btn-sm">Lisa kategooria</button>
    </div>`, 'lg:col-span-2');

  const dataCard = card('Andmed ja privaatsus', `
    <p class="text-sm">Kõik andmed on ainult selles seadmes. Äpp ei saada midagi välja.</p>
    <p class="text-sm muted mt-2">Praegune hoidla: <b>${esc(Store.backend)}</b></p>
    <p class="text-sm muted">Andmeskeemi versioon ${state.schema}, ${state.tx.length} tehingut, ${state.rules.length} reeglit, ${Object.keys(state.history).length} arhiveeritud kuud.</p>
    <div class="flex flex-wrap gap-2 mt-4">
      <button data-action="exportData" class="btn btn-ghost btn-sm">Laadi varukoopia alla</button>
      <button data-action="pickFile" data-kind="json" class="btn btn-ghost btn-sm">Taasta varukoopiast</button>
      <input type="file" accept=".json,application/json" data-file="json" hidden>
    </div>
    <button data-action="reset" class="btn btn-ghost btn-sm mt-4" style="color:var(--bad)">Kustuta kõik andmed</button>`);

  return `<div class="grid gap-4 lg:grid-cols-3">${catCard}${dataCard}</div>`;
}

/* ---------- 8. TEGEVUSED ---------- */
let toastTimer = null, undoFn = null;
function toast(msg, opts = {}) {
  const el = $('#toast');
  undoFn = opts.undo || null;
  el.innerHTML = `<span>${esc(msg)}</span>${undoFn ? '<button data-undo>Võta tagasi</button>' : ''}`;
  el.className = `toast show ${opts.type === 'error' ? 'toast-error' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), opts.ms || 4500);
}

function confirmTwice(el, fn, label = 'Kinnita') {
  if (el.dataset.armed) return fn();
  const orig = el.textContent;
  el.dataset.armed = '1';
  el.textContent = label;
  el.classList.add('armed');
  setTimeout(() => { if (el.isConnected) { delete el.dataset.armed; el.textContent = orig; el.classList.remove('armed'); } }, 3000);
}

function pressKey(k) {
  if (k === 'del') kp = kp.slice(0, -1);
  else if (k === ',') { if (!kp.includes(',')) kp = (kp || '0') + ','; }
  else {
    const [whole, dec] = kp.split(',');
    if (dec !== undefined ? dec.length >= 2 : whole.length >= 6) return;
    kp = kp === '0' ? k : kp + k;
  }
  const d = $('#kp-display');
  if (d) d.textContent = kp || '0';
  $$('[data-action="quickAdd"]').forEach(b => b.classList.toggle('dim', !(num(kp) > 0)));
}

function addQuick(catId) {
  const amount = round2(num(kp));
  if (!(amount > 0)) return toast('Sisesta enne summa numbrilaualt.', { type: 'error' });
  const t = { id: uid(), date: todayISO(), amount, cat: catId, note: '', merchant: '', source: 'manual', reconciled: false };
  state.tx.push(t);
  kp = '';
  commit();
  const cat = getCat(catId);
  toast(`Lisatud ${eur(amount)}: ${cat.name}`, { undo: () => { state.tx = state.tx.filter(x => x.id !== t.id); commit(); } });
}

function deleteTx(id) {
  const i = state.tx.findIndex(t => t.id === id);
  if (i < 0) return;
  const [removed] = state.tx.splice(i, 1);
  commit();
  toast('Tehing kustutatud.', { undo: () => { state.tx.splice(i, 0, removed); commit(); } });
}

function addCategory() {
  const name = $('#nc-name').value.trim();
  if (!name) return toast('Sisesta kategooria nimi.', { type: 'error' });
  if (state.categories.some(c => c.name.toLowerCase() === name.toLowerCase())) return toast('Selle nimega kategooria on juba olemas.', { type: 'error' });
  state.categories.push({ id: 'c-' + uid(), name, color: $('#nc-color').value, daily: $('#nc-daily').checked });
  commit();
  toast(`Kategooria „${name}“ lisatud.`);
}

// Ohutu kustutamine: tehingud liiguvad varukategooriasse, seotud reeglid eemaldatakse
function deleteCategory(id) {
  if (id === FALLBACK_CAT) return;
  let moved = 0;
  for (const t of state.tx) if (t.cat === id) { t.cat = FALLBACK_CAT; moved++; }
  state.rules = state.rules.filter(r => r.cat !== id);
  state.categories = state.categories.filter(c => c.id !== id);
  commit();
  toast(`Kategooria kustutatud. ${nTx(moved)} liikus kategooriasse „${getCat(FALLBACK_CAT).name}“.`);
}

const csvLine = (arr, sep) => arr.map(v => `"${String(v).replace(/"/g, '""')}"`).join(sep);

function toSwedbank(rows, Y, M) {
  const acc = 'EE382200221020145685';
  return [
    csvLine(['Kliendi konto', 'Reatüüp', 'Kuupäev', 'Saaja/Maksja', 'Selgitus', 'Summa', 'Valuuta', 'Deebet/Kreedit', 'Arhiivi tunnus', 'Tehingu tüüp', 'Viitenumber', 'Dokumendi number'], ';'),
    csvLine([acc, '10', `01.${M}.${Y}`, '', 'Algsaldo', '1520,00', 'EUR', 'K', '', 'AS', '', ''], ';'),
    csvLine([acc, '20', `01.${M}.${Y}`, 'TÖÖANDJA OÜ', 'Palk', '1200,00', 'EUR', 'K', `SIM-${Y}${M}-PALK`, 'MK', '', ''], ';'),
    ...rows.map(r => csvLine([acc, '20', `${r.date.slice(8)}.${M}.${Y}`, r.merchant, 'Kaardimakse', r.amount.toFixed(2).replace('.', ','), 'EUR', 'D', r.ref, 'KAART', '', ''], ';'))
  ].join('\r\n');
}

function toLHV(rows, Y, M) {
  const acc = 'EE717700771001234567';
  return [
    csvLine(['Kliendi konto', 'Dokumendi number', 'Kuupäev', 'Saaja/maksja konto', 'Saaja/maksja nimi', 'Saaja panga kood', 'Tühi', 'Deebet/Kreedit (D/C)', 'Summa', 'Viitenumber', 'Arhiveerimistunnus', 'Selgitus', 'Teenustasu', 'Valuuta', 'Isikukood või registrikood'], ','),
    csvLine([acc, '', `${Y}-${M}-01`, '', 'TÖÖANDJA OÜ', '', '', 'C', '1200.00', '', `SIM-${Y}${M}-PALK`, 'Palk', '0.00', 'EUR', ''], ','),
    ...rows.map(r => csvLine([acc, '', r.date, '', r.merchant, '', '', 'D', (-r.amount).toFixed(2), '', r.ref, 'Kaardimakse', '0.00', 'EUR', ''], ','))
  ].join('\r\n');
}

// Loob päris panga formaadis CSV teksti ja saadab selle läbi sama toru nagu päris fail
function simulateBank(format = 'swedbank') {
  const mk = monthKey(), [Y, M] = mk.split('-'), dim = daysInMonth(mk), today = new Date().getDate();
  const MERCH = { food: 'RIMI KESKLINN', transport: 'BOLT.EU/R/2409', fixed: 'TELIA EESTI AS' };
  const out = state.tx.filter(t => t.source === 'manual' && !t.reconciled && monthKey(t.date) === mk).slice(0, 3)
    .map(t => ({ day: Math.min(dim, +t.date.slice(8) + 1), merchant: MERCH[t.cat] || 'KOHVIK RÖST', amount: t.amount }));
  const demo = [['RIMI HAABERSTI', 23.45], ['BOLT.EU/O/2409', 6.8], ['WOLT OY', 18.9], ['APOLLO KINO SOLARIS', 11.5],
    ['CIRCLE K TALLINN', 42.1], ['SELVER KRISTIINE', 15.37], ['SPOTIFY P3F9A1', 11.99], ['ELEKTRILEVI OU', 38.2]];
  demo.forEach(([merchant, amount], i) => out.push({ day: 1 + Math.floor(i * (today - 1) / demo.length), merchant, amount }));
  const rows = out.map(r => ({ ...r, date: `${Y}-${M}-${pad(r.day)}`, ref: `SIM-${mk}-${pad(r.day)}-${r.merchant.replace(/[^A-Z0-9]/g, '')}-${r.amount}` }));
  const lhv = format === 'lhv';
  importCSV(lhv ? toLHV(rows, Y, M) : toSwedbank(rows, Y, M), lhv ? 'Simuleeritud LHV' : 'Simuleeritud Swedbank');
}

function importCSV(text, label) {
  try {
    const rows = normalizeBankRows(parseCSV(text));
    if (!rows.length) return toast('Failist ei leitud ühtegi väljaminekut.', { type: 'error' });
    const s = ingestBankRows(rows);
    if (state.ui.view !== 'strategy') { state.ui.view = 'strategy'; commit(); }
    toast(`${label}. Liidetud käsitsi kuludega: ${s.matched}. Reegliga kategoriseeritud: ${s.ruled}. Vajab sinu valikut: ${s.unknown}.${s.dup ? ` Korduvad read jäeti vahele: ${s.dup}.` : ''}`, { ms: 7000 });
  } catch (err) {
    toast(err.message || 'CSV-faili lugemine ebaõnnestus.', { type: 'error' });
  }
}

async function readCSVFile(f) {
  if (!f) return;
  if (!/\.(csv|txt)$/i.test(f.name)) return toast('Vali CSV-fail (.csv).', { type: 'error' });
  const buf = await f.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes(String.fromCharCode(0xFFFD))) text = new TextDecoder('windows-1257').decode(buf); // vanemad Eesti pangafailid
  importCSV(text, f.name);
}

async function importJSON(f) {
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.tx)) throw new Error('vale fail');
    state = migrate(data);
    applyThemeMeta();
    commit();
    toast('Varukoopia taastatud.');
  } catch (e) {
    toast('See fail ei ole Quant Budgeti varukoopia.', { type: 'error' });
  }
}

function exportJSON() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `quant-budget-varukoopia-${todayISO()}.json` });
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Varukoopia allalaadimine alustatud.');
}

async function resetAll() {
  await Store.clear();
  state = defaultState();
  kp = '';
  applyThemeMeta();
  commit();
  toast('Kõik andmed kustutati. Alustad puhtalt lehelt.');
}

const ACTIONS = {
  nav: el => { state.ui.view = el.dataset.view; if (el.dataset.view === 'quick') state.ui.viewMonth = monthKey(); commit(); window.scrollTo(0, 0); },
  theme: () => { state.ui.theme = state.ui.theme === 'dark' ? 'light' : 'dark'; applyThemeMeta(); commit(); },
  key: el => pressKey(el.dataset.key),
  quickAdd: el => addQuick(el.dataset.cat),
  deleteTx: el => deleteTx(el.dataset.id),
  transfer: () => {
    const mk = monthKey();
    const c = calc(mk);
    const cur = state.transfers[mk] || { done: false, amount: 0 };
    const nextDone = !cur.done;
    state.transfers[mk] = { done: nextDone, amount: nextDone ? c.invest : 0 };
    commit();
    if (nextDone) toast('Tubli! Maksid kõigepealt iseendale.');
  },
  addAlloc: () => { state.allocations.push({ id: 'a-' + uid(), name: 'Uus eesmärk', pct: 0, invest: false }); commit(); },
  delAlloc: el => confirmTwice(el, () => { state.allocations = state.allocations.filter(a => a.id !== el.dataset.id); commit(); }),
  addCat: addCategory,
  delCat: el => confirmTwice(el, () => deleteCategory(el.dataset.id)),
  addRule: () => {
    if (!upsertRule($('#new-rule-pattern').value, $('#new-rule-cat').value)) return toast('Sisesta märksõna.', { type: 'error' });
    const n = applyRules();
    commit();
    toast(`Reegel lisatud.${n ? ` Kategooria sai ${nTx(n)}.` : ''}`);
  },
  delRule: el => { state.rules = state.rules.filter(r => r.id !== el.dataset.id); commit(); },
  filter: el => { state.ui.filter = el.dataset.filter; commit(); },
  simulate: () => simulateBank(state.ui.simFormat),
  pickFile: el => $(`input[data-file="${el.dataset.kind}"]`)?.click(),
  exportData: exportJSON,
  reset: el => confirmTwice(el, resetAll, 'Kliki uuesti: kustutab kõik')
};

/* ---------- 9. SÜNDMUSED ---------- */
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (el && ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el, e);
});

app.addEventListener('keydown', e => {
  const el = e.target.closest('[data-dropzone]');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACTIONS.pickFile(el); }
});

const setModel = el => { state[el.dataset.model] = clamp(num(el.value), 0, num(el.max, Infinity)); };

app.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.alloc) {
    const a = state.allocations.find(x => x.id === d.alloc);
    if (!a) return;
    const others = state.allocations.reduce((s, x) => s + (x === a ? 0 : x.pct), 0);
    a.pct = clamp(Math.round(num(el.value)), 0, Math.max(0, 100 - others));
    if (+el.value !== a.pct) el.value = a.pct;
  } else if (d.model) setModel(el);
  else return;
  Store.save(state);
  refreshLive();
});

app.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.file) { const f = el.files && el.files[0]; el.value = ''; return d.file === 'csv' ? readCSVFile(f) : importJSON(f); }
  if (d.model) {
    setModel(el);
    el.value = state[d.model];
    if (d.model === 'returnRate') return commit();
    Store.save(state);
    return refreshLive();
  }
  if (d.alloc) return commit();
  if (d.ui === 'viewMonth') { state.ui.viewMonth = el.value; return commit(); }
  if (d.ui) { state.ui[d.ui] = el.value; return Store.save(state); }
  if (d.uiBool) { state.ui[d.uiBool] = el.checked; return commit(); }
  if (d.txCat) return setTxCategory(d.txCat, el.value);
  if (d.ruleCat) {
    const r = state.rules.find(x => x.id === d.ruleCat);
    if (r) r.cat = el.value;
    applyRules();
    return commit();
  }
  if (d.allocField) {
    const a = state.allocations.find(x => x.id === d.id);
    if (!a) return;
    if (d.allocField === 'invest') { a.invest = el.checked; return commit(); }
    a.name = el.value.trim() || a.name;
    el.value = a.name;
    Store.save(state);
    return refreshLive();
  }
  if (d.catField) {
    const cat = state.categories.find(x => x.id === d.id);
    if (!cat) return;
    cat[d.catField] = d.catField === 'daily' ? el.checked : (el.value.trim() || cat[d.catField]);
    commit();
  }
});

['dragenter', 'dragover'].forEach(type => app.addEventListener(type, e => {
  const z = e.target.closest('[data-dropzone]');
  if (!z) return;
  e.preventDefault();
  z.classList.add('drop-active');
}));
app.addEventListener('dragleave', e => {
  const z = e.target.closest('[data-dropzone]');
  if (z && !z.contains(e.relatedTarget)) z.classList.remove('drop-active');
});
app.addEventListener('drop', e => {
  const z = e.target.closest('[data-dropzone]');
  if (!z) return;
  e.preventDefault();
  z.classList.remove('drop-active');
  readCSVFile(e.dataTransfer.files[0]);
});
// Väljaspool ala lohistatud fail ei tohi brauseris avaneda
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if (state.ui.view !== 'quick' || e.target.matches('input, select, textarea')) return;
  if (/^[0-9]$/.test(e.key)) pressKey(e.key);
  else if (e.key === ',' || e.key === '.') pressKey(',');
  else if (e.key === 'Backspace') pressKey('del');
  else return;
  e.preventDefault();
});

$('#toast').addEventListener('click', e => {
  if (!e.target.closest('[data-undo]') || !undoFn) return;
  const fn = undoFn;
  undoFn = null;
  $('#toast').classList.remove('show');
  fn();
});

/* ---------- KÄIVITUS ---------- */
(async function init() {
  state = migrate(await Store.load());
  rolloverIfNeeded();
  applyThemeMeta();
  render();
  Store.save(state);
})();

</script>
